name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # 把 ffmpeg.wasm 以固定版本下載後放進網站 (同源自架,不依賴第三方 CDN)。
      # 失敗時會把原因直接寫進 Annotations,不需登入也看得到。
      - name: Vendor ffmpeg.wasm (pinned, single-thread core)
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/vendor.log"; : > "$LOG"
          fail() {
            local msg
            msg=$(tail -n 25 "$LOG" | tr '\n\r' '||' | tr -d '%' | cut -c1-1200)
            echo "::error title=Vendor step failed::$1 || $msg"
            echo "----- full log -----"; cat "$LOG"
            exit 1
          }
          mkdir -p ffbuild || fail "mkdir ffbuild"
          cd ffbuild || fail "cd ffbuild"
          npm init -y >>"$LOG" 2>&1 || fail "npm init"
          npm install --no-audit --no-fund @ffmpeg/ffmpeg@0.12.10 @ffmpeg/core@0.12.10 >>"$LOG" 2>&1 || fail "npm install"
          cd ..
          FF=ffbuild/node_modules/@ffmpeg/ffmpeg/dist/esm
          CORE=ffbuild/node_modules/@ffmpeg/core/dist/esm
          {
            echo "== ffmpeg package files =="; find ffbuild/node_modules/@ffmpeg/ffmpeg -maxdepth 3 -type f | sort
            echo "== core package files ==";   find ffbuild/node_modules/@ffmpeg/core   -maxdepth 3 -type f | sort
          } >>"$LOG" 2>&1
          for f in "$FF/index.js" "$FF/worker.js" "$CORE/ffmpeg-core.js" "$CORE/ffmpeg-core.wasm"; do
            [ -s "$f" ] || fail "missing file: $f"
          done
          mkdir -p site/vendor/ffmpeg site/vendor/core || fail "mkdir vendor"
          cp -r "$FF"/. site/vendor/ffmpeg/ >>"$LOG" 2>&1 || fail "copy ffmpeg esm"
          cp "$CORE/ffmpeg-core.js" "$CORE/ffmpeg-core.wasm" site/vendor/core/ >>"$LOG" 2>&1 || fail "copy core"
          cat "$LOG"
          ls -lh site/vendor/ffmpeg site/vendor/core

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
